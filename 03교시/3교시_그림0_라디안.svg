<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Noto Sans KR, sans-serif"><rect width="780" height="430" fill="#ffffff"/><text x="24" y="34" font-size="16" font-weight="700" fill="#1b2330">1 라디안 = 반지름 길이만큼의 호에 대응하는 각</text><circle cx="210" cy="190" r="100" fill="none" stroke="#c3ccd8" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="210" y1="190" x2="310" y2="190" stroke="#1b2330" stroke-width="2"/><line x1="210" y1="190" x2="264.0" y2="105.9" stroke="#1b2330" stroke-width="2"/><path d="M 310 190 A 100 100 0 0 0 264.0 105.9" fill="none" stroke="#1f5fa8" stroke-width="4.5"/><path d="M 244 190 A 34 34 0 0 0 228.4 161.4" fill="none" stroke="#5a6b7d" stroke-width="1.3"/><text x="264" y="174" font-size="12.5" font-weight="600" fill="#5a6b7d">1 rad</text><text x="260.0" y="208" font-size="12" fill="#1b2330" text-anchor="middle">반지름 r</text><text x="211.0" y="141.9" font-size="12" fill="#1b2330" text-anchor="middle">r</text><text x="320.6" y="129.6" font-size="12.5" font-weight="700" fill="#1f5fa8">호의 길이 = r</text><text x="210" y="330" font-size="13" fill="#1b2330" text-anchor="middle">호의 길이가 반지름과 같을 때의 각</text><text x="210" y="354" font-size="13" font-weight="700" fill="#1f5fa8" text-anchor="middle">이것이 1 라디안 (약 57.3°)</text><rect x="470" y="70" width="292" height="280" fill="#eef3f8" stroke="#c3ccd8"/><text x="490" y="100" font-size="13.5" font-weight="700" fill="#1b2330">한 바퀴는 원둘레 2πr 이므로</text><text x="490" y="124" font-size="13.5" font-weight="700" fill="#1f5fa8">한 바퀴 = 2π ≈ 6.28 라디안</text><text x="490" y="164" font-size="12.5" font-weight="700" fill="#1b2330" font-family="IBM Plex Mono, monospace" xml:space="preserve">라디안</text><text x="638" y="164" font-size="12.5" font-weight="700" fill="#1b2330" font-family="IBM Plex Mono, monospace" xml:space="preserve">도</text><line x1="488" y1="172" x2="738" y2="172" stroke="#c3ccd8" stroke-width="1"/><text x="490" y="190" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">1</text><text x="638" y="190" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">약 57.3°</text><text x="490" y="216" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">π/2 ≈ 1.57</text><text x="638" y="216" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">90°</text><text x="490" y="242" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">π   ≈ 3.14</text><text x="638" y="242" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">180°</text><text x="490" y="268" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">2π  ≈ 6.28</text><text x="638" y="268" font-size="12.5" font-weight="500" fill="#5a6b7d" font-family="IBM Plex Mono, monospace" xml:space="preserve">360°</text><text x="490" y="310" font-size="12.5" font-weight="700" fill="#c0392b">sin(1) = 0.84   ← 1 라디안</text><text x="490" y="332" font-size="12.5" font-weight="700" fill="#c0392b">sin(1°) = 0.017  ← 1 도</text><text x="24" y="414" font-size="12.5" fill="#1b2330">PE 식의 sin, cos 안에 들어가는 값은 모두 라디안입니다.</text></svg>