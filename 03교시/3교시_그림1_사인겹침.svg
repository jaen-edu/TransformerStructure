<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Noto Sans KR, sans-serif"><rect width="760" height="470" fill="#ffffff"/><text x="24" y="34" font-size="16" font-weight="700" fill="#1b2330">사인 값 하나로는 위치를 특정할 수 없다</text><text x="24" y="54" font-size="12" fill="#5a6b7d">각은 모두 라디안 단위입니다 (1 라디안 = 약 57.3도)</text><line x1="115" y1="81" x2="115" y2="435" stroke="#e3e9f0" stroke-width="1"/><line x1="73" y1="393" x2="427" y2="393" stroke="#e3e9f0" stroke-width="1"/><line x1="385" y1="81" x2="385" y2="435" stroke="#e3e9f0" stroke-width="1"/><line x1="73" y1="123" x2="427" y2="123" stroke="#e3e9f0" stroke-width="1"/><line x1="73" y1="258" x2="427" y2="258" stroke="#c3ccd8" stroke-width="1.5"/><line x1="250" y1="435" x2="250" y2="81" stroke="#c3ccd8" stroke-width="1.5"/><polygon points="427,258 420,254 420,262" fill="#c3ccd8"/><polygon points="250,81 246,88 254,88" fill="#c3ccd8"/><text x="433" y="273" font-size="13" fill="#5a6b7d">cos</text><text x="258" y="77" font-size="13" fill="#5a6b7d">sin</text><circle cx="250" cy="258" r="135" fill="none" stroke="#c3ccd8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="381" y="277" font-size="11" fill="#5a6b7d">1</text><text x="111" y="277" font-size="11" fill="#5a6b7d">-1</text><text x="258" y="127" font-size="11" fill="#5a6b7d">1</text><text x="258" y="397" font-size="11" fill="#5a6b7d">-1</text><line x1="85" y1="193.3" x2="415" y2="193.3" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="81" y="185.3" font-size="12" fill="#c0392b" text-anchor="end">sin = 0.48</text><line x1="250" y1="258" x2="368.5" y2="193.3" stroke="#c0392b" stroke-width="1.6"/><circle cx="368.5" cy="193.3" r="5.5" fill="#c0392b"/><text x="386.5" y="187.3" font-size="13" font-weight="600" fill="#c0392b" text-anchor="start">A</text><line x1="250" y1="258" x2="131.5" y2="193.3" stroke="#c0392b" stroke-width="1.6"/><circle cx="131.5" cy="193.3" r="5.5" fill="#c0392b"/><text x="113.5" y="187.3" font-size="13" font-weight="600" fill="#c0392b" text-anchor="end">B</text><rect x="520" y="136" width="234" height="248" fill="#eef3f8" stroke="#c3ccd8"/><text x="536" y="166" font-size="12.5" font-weight="600" fill="#1b2330" font-family="Noto Sans KR, sans-serif" xml:space="preserve">두 점 A와 B는</text><text x="536" y="186" font-size="12.5" font-weight="600" fill="#1b2330" font-family="Noto Sans KR, sans-serif" xml:space="preserve">사인 값이 같습니다.</text><text x="536" y="226" font-size="12.5" font-weight="400" fill="#c0392b" font-family="IBM Plex Mono, monospace" xml:space="preserve">A    sin  0.48    cos   0.88</text><text x="536" y="246" font-size="12.5" font-weight="400" fill="#c0392b" font-family="IBM Plex Mono, monospace" xml:space="preserve">B    sin  0.48    cos  -0.88</text><text x="536" y="286" font-size="12.5" font-weight="400" fill="#5a6b7d" font-family="Noto Sans KR, sans-serif" xml:space="preserve">사인만 보면 A인지 B인지</text><text x="536" y="306" font-size="12.5" font-weight="400" fill="#5a6b7d" font-family="Noto Sans KR, sans-serif" xml:space="preserve">알 수 없습니다.</text><text x="536" y="346" font-size="12.5" font-weight="600" fill="#1f5fa8" font-family="Noto Sans KR, sans-serif" xml:space="preserve">코사인까지 보면</text><text x="536" y="366" font-size="12.5" font-weight="600" fill="#1f5fa8" font-family="Noto Sans KR, sans-serif" xml:space="preserve">부호가 달라 구별됩니다.</text></svg>