<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="Noto Sans KR, sans-serif"><rect width="780" height="540" fill="#ffffff"/><text x="24" y="34" font-size="16" font-weight="700" fill="#1b2330">PE 의 네 자리는 좌표 두 개다</text><rect x="150" y="70" width="84" height="46" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="1.4"/><text x="192.0" y="100" font-size="16" font-weight="600" fill="#1f5fa8" text-anchor="middle" font-family="IBM Plex Mono, monospace">0.84</text><text x="192.0" y="62" font-size="11" fill="#5a6b7d" text-anchor="middle">d0 sin</text><rect x="242" y="70" width="84" height="46" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="1.4"/><text x="284.0" y="100" font-size="16" font-weight="600" fill="#1f5fa8" text-anchor="middle" font-family="IBM Plex Mono, monospace">0.54</text><text x="284.0" y="62" font-size="11" fill="#5a6b7d" text-anchor="middle">d1 cos</text><rect x="334" y="70" width="84" height="46" fill="#fdf0e4" stroke="#c2680f" stroke-width="1.4"/><text x="376.0" y="100" font-size="16" font-weight="600" fill="#c2680f" text-anchor="middle" font-family="IBM Plex Mono, monospace">0.01</text><text x="376.0" y="62" font-size="11" fill="#5a6b7d" text-anchor="middle">d2 sin</text><rect x="426" y="70" width="84" height="46" fill="#fdf0e4" stroke="#c2680f" stroke-width="1.4"/><text x="468.0" y="100" font-size="16" font-weight="600" fill="#c2680f" text-anchor="middle" font-family="IBM Plex Mono, monospace">1.00</text><text x="468.0" y="62" font-size="11" fill="#5a6b7d" text-anchor="middle">d3 cos</text><text x="134" y="100" font-size="15" fill="#1b2330" text-anchor="end" font-family="IBM Plex Mono, monospace">PE(1) =</text><path d="M 150 126 L 150 136 L 326 136 L 326 126" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="238.0" y="154" font-size="12.5" font-weight="600" fill="#1f5fa8" text-anchor="middle">1.00 rad 씩 도는 원</text><path d="M 334 126 L 334 136 L 510 136 L 510 126" fill="none" stroke="#c2680f" stroke-width="1.4"/><text x="422.0" y="154" font-size="12.5" font-weight="600" fill="#c2680f" text-anchor="middle">0.01 rad 씩 도는 원</text><text x="24" y="194" font-size="12.5" fill="#5a6b7d">식의 2i 와 2i+1 은 같은 i 를 씁니다. 분모가 같으므로 같은 각(라디안)의 sin 과 cos 입니다.</text><text x="200" y="236" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="middle">첫째 원  (d0·d1)</text><line x1="84" y1="358" x2="316" y2="358" stroke="#c3ccd8" stroke-width="1.2"/><line x1="200" y1="474" x2="200" y2="242" stroke="#c3ccd8" stroke-width="1.2"/><circle cx="200" cy="358" r="92" fill="none" stroke="#c3ccd8" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="200" y1="358" x2="292.0" y2="358.0" stroke="#1f5fa8" stroke-width="1.3" opacity="0.35"/><circle cx="292.0" cy="358.0" r="4.5" fill="#1f5fa8" opacity="0.35"/><text x="308.0" y="351.0" font-size="11" fill="#1f5fa8" text-anchor="start">0</text><line x1="200" y1="358" x2="249.7" y2="280.6" stroke="#1f5fa8" stroke-width="1.3" opacity="0.55"/><circle cx="249.7" cy="280.6" r="4.5" fill="#1f5fa8" opacity="0.55"/><text x="265.7" y="273.6" font-size="11" fill="#1f5fa8" text-anchor="start">1</text><line x1="200" y1="358" x2="161.7" y2="274.3" stroke="#1f5fa8" stroke-width="1.3" opacity="0.75"/><circle cx="161.7" cy="274.3" r="4.5" fill="#1f5fa8" opacity="0.75"/><text x="145.7" y="267.3" font-size="11" fill="#1f5fa8" text-anchor="end">2</text><line x1="200" y1="358" x2="108.9" y2="345.0" stroke="#1f5fa8" stroke-width="1.3" opacity="0.95"/><circle cx="108.9" cy="345.0" r="4.5" fill="#1f5fa8" opacity="0.95"/><text x="92.9" y="338.0" font-size="11" fill="#1f5fa8" text-anchor="end">3</text><text x="200" y="490" font-size="12" fill="#5a6b7d" text-anchor="middle">위치마다 1 라디안씩 돈다</text><text x="560" y="236" font-size="13.5" font-weight="700" fill="#c2680f" text-anchor="middle">둘째 원  (d2·d3)</text><line x1="444" y1="358" x2="676" y2="358" stroke="#c3ccd8" stroke-width="1.2"/><line x1="560" y1="474" x2="560" y2="242" stroke="#c3ccd8" stroke-width="1.2"/><circle cx="560" cy="358" r="92" fill="none" stroke="#c3ccd8" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="560" y1="358" x2="652.0" y2="358.0" stroke="#c2680f" stroke-width="1.3" opacity="0.35"/><circle cx="652.0" cy="358.0" r="4.5" fill="#c2680f" opacity="0.35"/><line x1="560" y1="358" x2="652.0" y2="357.1" stroke="#c2680f" stroke-width="1.3" opacity="0.55"/><circle cx="652.0" cy="357.1" r="4.5" fill="#c2680f" opacity="0.55"/><line x1="560" y1="358" x2="652.0" y2="356.2" stroke="#c2680f" stroke-width="1.3" opacity="0.75"/><circle cx="652.0" cy="356.2" r="4.5" fill="#c2680f" opacity="0.75"/><line x1="560" y1="358" x2="652.0" y2="355.2" stroke="#c2680f" stroke-width="1.3" opacity="0.95"/><circle cx="652.0" cy="355.2" r="4.5" fill="#c2680f" opacity="0.95"/><text x="662" y="352" font-size="11" fill="#c2680f">0~3</text><text x="560" y="490" font-size="12" fill="#5a6b7d" text-anchor="middle">0.01 라디안씩 — 거의 제자리</text><text x="24" y="526" font-size="12.5" fill="#1b2330">원이 두 개입니다. 512차원 모델은 좌표 쌍이 256개, 즉 원이 256개입니다.</text></svg>